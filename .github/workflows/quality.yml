name: Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - name: Query npm advisories
        run: npm audit --omit=dev --json > artifacts/audit/npm-audit.json || true
      - name: Enforce high/critical advisory policy
        run: node scripts/check-vulnerabilities.mjs artifacts/audit/npm-audit.json
      - run: npm run quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp8-audit-and-build
          path: |
            artifacts/
            build/
