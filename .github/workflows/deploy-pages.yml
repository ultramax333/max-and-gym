name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Set deterministic build timestamp
        run: echo "BUILD_TIMESTAMP=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      - name: Query npm advisories
        run: npm audit --omit=dev --json > artifacts/audit/npm-audit.json || true
      - name: Enforce high/critical advisory policy
        run: node scripts/check-vulnerabilities.mjs artifacts/audit/npm-audit.json
      - run: npm run quality
      - name: Include signed Android installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="v$(node --input-type=module -e "import metadata from './package.json' with {type:'json'}; process.stdout.write(metadata.version)")"
          apk_url=""
          apk_name=""
          for attempt in {1..18}; do
            apk_name="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name | endswith("-release.apk")) | .name' 2>/dev/null | head -n 1 || true)"
            if [[ -n "$apk_name" ]]; then
              apk_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$release_tag/$apk_name"
              break
            fi
            echo "Waiting for signed Android release $release_tag (attempt $attempt/18)."
            sleep 10
          done
          if [[ -z "$apk_name" || -z "$apk_url" ]]; then
            echo "Signed Android release $release_tag was not published in time." >&2
            exit 1
          fi
          mkdir -p build/downloads
          curl --fail --location --retry 3 --retry-delay 2 "$apk_url" -o "build/downloads/$apk_name"
          cp "build/downloads/$apk_name" build/downloads/max-and-gym-latest.apk
          test -s "build/downloads/$apk_name"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed identity and subpath
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test --project=chromium-412 --grep "release identity"
