name: Android APK

on:
  push:
    branches:
      - master
      - 'fix/**'
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep this floor stable: GITHUB_RUN_NUMBER is monotonic for this workflow.
  # Raising the floor is allowed; lowering it would break Android upgrades.
  ANDROID_VERSION_CODE_FLOOR: '120000000'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.android-version.outputs.version_code }}
      version_name: ${{ steps.android-version.outputs.version_name }}
      signing_enabled: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - name: Install Android 36 platform
        run: '"$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Project Android version
        id: android-version
        shell: bash
        run: |
          version_code=$((ANDROID_VERSION_CODE_FLOOR + GITHUB_RUN_NUMBER))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Projected Android versionCode is outside the supported range." >&2
            exit 1
          fi
          version_name="$(node --input-type=module -e "import metadata from './package.json' with {type: 'json'}; process.stdout.write(metadata.version)")"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version_name" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v$version_name." >&2
            exit 1
          fi
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "Android build identity: $version_name ($version_code)" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run audit:android
      - run: npm run android:sync
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Compile and test Android application
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: max-and-gym-v${{ steps.android-version.outputs.version_name }}-${{ steps.android-version.outputs.version_code }}-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Check release signing configuration
        if: github.ref == 'refs/heads/master'
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          configured=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$ANDROID_STORE_PASSWORD"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" == 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signed release skipped: repository signing secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$configured" == 4 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Android release signing secrets are only partially configured." >&2
            exit 1
          fi
      - name: Materialize release keystore
        if: github.ref == 'refs/heads/master' && steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/max-and-gym-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: github.ref == 'refs/heads/master' && steps.signing.outputs.enabled == 'true'
        working-directory: android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify release APK signature
        if: github.ref == 'refs/heads/master' && steps.signing.outputs.enabled == 'true'
        run: '"$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk'
      - name: Name release APK for safe in-app discovery
        if: github.ref == 'refs/heads/master' && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p android/app/build/outputs/release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/release-artifacts/max-and-gym-v${{ steps.android-version.outputs.version_name }}-${{ steps.android-version.outputs.version_code }}-release.apk"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master' && steps.signing.outputs.enabled == 'true'
        with:
          name: max-and-gym-v${{ steps.android-version.outputs.version_name }}-${{ steps.android-version.outputs.version_code }}-release-apk
          path: android/app/build/outputs/release-artifacts/max-and-gym-v${{ steps.android-version.outputs.version_name }}-${{ steps.android-version.outputs.version_code }}-release.apk
          if-no-files-found: error

  publish-release:
    needs: android-apk
    if: github.ref == 'refs/heads/master' && needs.android-apk.outputs.signing_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: max-and-gym-v${{ needs.android-apk.outputs.version_name }}-${{ needs.android-apk.outputs.version_code }}-release-apk
          path: release-apk
      - name: Package public APK ZIP companion
        shell: bash
        run: |
          apk="release-apk/max-and-gym-v${{ needs.android-apk.outputs.version_name }}-${{ needs.android-apk.outputs.version_code }}-release.apk"
          zip_asset="release-apk/max-and-gym-v${{ needs.android-apk.outputs.version_name }}-${{ needs.android-apk.outputs.version_code }}-release-apk.zip"
          python3 - "$apk" "$zip_asset" <<'PY'
          import os
          import sys
          import zipfile

          apk, destination = sys.argv[1:]
          with zipfile.ZipFile(destination, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              archive.write(apk, arcname=os.path.basename(apk))
          PY
          test -s "$zip_asset"
      - name: Publish immutable-candidate GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v${{ needs.android-apk.outputs.version_name }}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; keeping its immutable APK." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Tag $release_tag exists without a release; refusing an ambiguous publication." >&2
            exit 1
          fi
          apk="release-apk/max-and-gym-v${{ needs.android-apk.outputs.version_name }}-${{ needs.android-apk.outputs.version_code }}-release.apk"
          zip_asset="release-apk/max-and-gym-v${{ needs.android-apk.outputs.version_name }}-${{ needs.android-apk.outputs.version_code }}-release-apk.zip"
          gh release create "$release_tag" "$apk" "$zip_asset#Signed APK in a ZIP for mobile download" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "Max & Gym $release_tag" --notes "Signed Android release. Back up your local data before updating."
