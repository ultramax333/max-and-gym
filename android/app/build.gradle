import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def packageMetadata = new JsonSlurper().parse(rootProject.file('../package.json'))
def appVersionName = packageMetadata.version as String
def androidVersionCodeValue = project.findProperty('androidVersionCode') ?:
        System.getenv('ANDROID_VERSION_CODE') ?:
        '120000000'
def appVersionCode
try {
    appVersionCode = Integer.parseInt(androidVersionCodeValue.toString())
} catch (NumberFormatException exception) {
    throw new GradleException('ANDROID_VERSION_CODE must be an integer.', exception)
}
if (appVersionCode < 1 || appVersionCode > 2100000000) {
    throw new GradleException('ANDROID_VERSION_CODE must be between 1 and 2100000000.')
}

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseStorePassword = System.getenv('ANDROID_STORE_PASSWORD')
def releaseSigningValues = [releaseKeystorePath, releaseKeyAlias, releaseKeyPassword, releaseStorePassword]
def releaseSigningConfigured = releaseSigningValues.every { value -> value != null && !value.isBlank() }
def partialReleaseSigningConfiguration = releaseSigningValues.any { value -> value != null && !value.isBlank() } &&
        !releaseSigningConfigured

if (partialReleaseSigningConfiguration) {
    throw new GradleException('Release signing requires ANDROID_KEYSTORE_PATH, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD and ANDROID_STORE_PASSWORD together.')
}

android {
    namespace = "io.github.ultramax333.maxandgym"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.ultramax333.maxandgym"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseKeystorePath)
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storePassword releaseStorePassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def createsReleaseArtifact = graph.allTasks.any { task ->
        task.name == 'assembleRelease' || task.name == 'bundleRelease'
    }
    if (createsReleaseArtifact && !releaseSigningConfigured) {
        throw new GradleException('Release output is disabled until all Android signing environment variables are configured.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
